name: Deploy Sroor Coffee ERP to Hostinger

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-qa:
    name: Run Automated Tests & QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, sqlite3
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Execute Tests via PHPUnit
        run: php artisan test

  deploy-to-hostinger:
    name: Deploy to Hostinger Production Server
    runs-on: ubuntu-latest
    needs: test-and-qa

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '145.79.20.98'
          username: 'u910151740'
          port: 65002
          password: ${{ secrets.HOSTINGER_PASSWORD || 'Ks@Rr12699' }}
          script: |
            echo "🚀 Connecting to Hostinger Server..."
            
            TARGET_DIR="/home/u910151740/domains/baraa-solutions.com/public_html/shipping"
            
            # Ensure target directory exists
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR
            
            # If git repo not initialized in target, clone or pull
            if [ -d ".git" ]; then
                echo "📥 Pulling latest updates from GitHub..."
                git fetch --all
                git reset --hard origin/main || git reset --hard origin/master
            else
                echo "📥 Cloning repository for the first time..."
                git clone https://github.com/kamalsroor1/sroor-cofe-erp.git .
            fi
            
            # Copy production .env if not present
            if [ ! -f ".env" ]; then
                cp .env.example .env
                php artisan key:generate --force
            fi
            
            echo "📦 Running Composer Install..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            
            echo "🗄️ Running Migrations and Seeders..."
            php artisan migrate --force --seed
            
            echo "⚡ Caching Config, Routes, and Views..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            echo "🔗 Linking Storage..."
            php artisan storage:link || true
            
            echo "🔒 Setting Proper Permissions..."
            chmod -R 775 storage bootstrap/cache
            
            echo "🎉 Deployment to Hostinger Finished Successfully!"
