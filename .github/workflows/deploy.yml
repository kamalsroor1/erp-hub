name: Deploy Sroor Coffee ERP to Hostinger

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-qa:
    name: Run Automated Tests & QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, sqlite3
          coverage: none

      - name: Install Composer Dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Setup Application Key for Testing
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Execute Tests via PHPUnit
        run: php artisan test

  deploy-to-hostinger:
    name: Deploy to Hostinger Production Server
    runs-on: ubuntu-latest
    needs: test-and-qa

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Paramiko SSH Engine
        run: pip install paramiko

      - name: Execute Remote Hostinger Deployment
        run: python deploy_to_sroor_subdomain.py
