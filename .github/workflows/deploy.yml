name: Deploy Sroor Coffee ERP to Hostinger

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-qa:
    name: Run Automated Tests & QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, sqlite3
          coverage: none

      - name: Install Composer Dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Execute Tests via PHPUnit
        run: php artisan test

  deploy-to-hostinger:
    name: Deploy to Hostinger Production Server
    runs-on: ubuntu-latest
    needs: test-and-qa

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '145.79.20.98'
          username: 'u910151740'
          port: 65002
          password: ${{ secrets.HOSTINGER_PASSWORD || 'Ks@Rr12699' }}
          script: |
            echo "🚀 Connecting to Hostinger Server..."
            
            PHP84="/opt/alt/php84/usr/bin/php"
            TARGET_DIR="/home/u910151740/domains/sroor.baraa-solutions.com/public_html"
            
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR
            
            if [ -d ".git" ]; then
                echo "📥 Pulling latest updates from GitHub..."
                git fetch --all
                git reset --hard origin/main
            else
                echo "📥 Cloning repository for the first time..."
                git clone https://github.com/kamalsroor1/sroor-cofe-erp.git .
            fi
            
            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache
            
            cat << 'EOF' > .env
APP_NAME="سرور لإدارة الفواتير والمخزون"
APP_ENV=production
APP_KEY=base64:X8p3v8Xz1r1e8tP4w2Q9y7K5m3n1b2c4d6f8g0h2j4k=
APP_DEBUG=false
APP_TIMEZONE=Africa/Cairo
APP_URL=https://sroor.baraa-solutions.com
APP_LOCALE=ar
APP_FALLBACK_LOCALE=ar

LOG_CHANNEL=stack
LOG_DEPRECATIONS_CHANNEL=null
LOG_LEVEL=error

DB_CONNECTION=mysql
DB_HOST=127.0.0.1
DB_PORT=3306
DB_DATABASE=u910151740_sroor
DB_USERNAME=u910151740_sroor
DB_PASSWORD=Ks@Rr3172024

SESSION_DRIVER=file
SESSION_LIFETIME=120
SESSION_ENCRYPT=false

BROADCAST_CONNECTION=log
FILESYSTEM_DISK=local
QUEUE_CONNECTION=sync

CACHE_STORE=file
CACHE_PREFIX=sroor_subdomain_
EOF

            echo "📦 Running Composer Install with PHP 8.4..."
            $PHP84 $(which composer) install --no-dev --prefer-dist --optimize-autoloader --no-interaction || true
            
            echo "🗄️ Running Migrations & Seeders..."
            $PHP84 artisan migrate --force --seed || true
            
            echo "⚡ Caching Config, Routes, and Views..."
            $PHP84 artisan config:cache || true
            $PHP84 artisan route:cache || true
            $PHP84 artisan view:cache || true
            $PHP84 artisan storage:link || true
            
            chmod -R 775 storage bootstrap/cache
            chmod 644 .env
            
            echo "🎉 GitHub Actions Deployment to Hostinger Finished Successfully!"
