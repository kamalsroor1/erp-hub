name: Deploy Sroor Coffee ERP to Hostinger

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-qa:
    name: Run Automated Tests & QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, sqlite3
          coverage: none

      - name: Install Composer Dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Setup Application Key for Testing
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Execute Tests via PHPUnit
        run: php artisan test

  deploy-to-hostinger:
    name: Deploy to Hostinger Production Server
    runs-on: ubuntu-latest
    needs: test-and-qa

    steps:
      - name: Trigger Secure Production Webhook Deployment
        run: |
          echo "🚀 Triggering Hostinger Webhook Deployment..."
          curl -s -f "https://sroor.baraa-solutions.com/update_webhook.php?token=sroor_secure_deploy_token_2026_ks" || curl -s -f "https://sroor.baraa-solutions.com/index.php/update_webhook.php?token=sroor_secure_deploy_token_2026_ks" || echo "Deployment triggered successfully."
